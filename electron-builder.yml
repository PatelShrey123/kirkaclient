appId: com.kirkaxpert.client
productName: KirkaXpert Client
directories:
  output: "build"
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "src/assets/img/icon.png"
  artifactName: "${name}-setup-win-${arch}-${version}.${ext}"
mac:
  target: dmg
  icon: "src/assets/img/icon.icns"
  artifactName: "${name}-setup-mac-${version}.${ext}"
linux:
  target:
    - AppImage
  category: Game
  icon: "src/assets/img/icon.png"
  artifactName: "${name}-${version}-linux-${arch}.${ext}"
publish:
  - provider: github
    owner: PatelShrey123
    repo: kirkaclient
    releaseType: release
